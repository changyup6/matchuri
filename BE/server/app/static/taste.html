 const t=(DATA.trail||[]).slice(0,Number($('scrub').value));
 const xy=p=>`${p.x*100} ${p.y*100}`,mid=(a,b)=>({x:(a.x+b.x)/2,y:(a.y+b.y)/2});
 let trail='';for(let i=0;i<t.length-1;i++){const age=(i+1)/Math.max(1,t.length-1),from=i===0?t[0]:mid(t[i-1],t[i]),to=i===t.length-2?t[i+1]:mid(t[i],t[i+1]);trail+=`<path class="seg" d="M ${xy(from)} Q ${xy(t[i])} ${xy(to)}" stroke-opacity="${.16+.84*age}" stroke-width="${view.w*(.003+.004*age)}"></path>`;}
 if(t.length>10){const back=t[t.length-11];trail+=`<circle class="ghost" cx="${back.x*100}" cy="${back.y*100}" r="${view.w*.024}" stroke-width="${view.w*.0045}"></circle><text class="ghost-label" x="${back.x*100}" y="${back.y*100-view.w*.037}" font-size="${view.w*.026}" stroke-width="${view.w*.006}">좋아요 10개 전</text>`;}
 if(t.length){const first=t[0],last=t[t.length-1];trail+=`<circle class="start" cx="${first.x*100}" cy="${first.y*100}" r="${view.w*.009}"></circle><circle class="halo" cx="${last.x*100}" cy="${last.y*100}" r="${view.w*.04}"></circle><circle class="head" cx="${last.x*100}" cy="${last.y*100}" r="${view.w*.018}" stroke-width="${view.w*.005}"></circle>`;}
 svg.innerHTML=html+`<g class="trail-layer">${trail}</g>`;
 const point=t[t.length-1];$('step').textContent=point?`${point.n??'—'}번째 · ${point.store}`:'아직 좋아요가 없어요';$('step').title=point?`${point.n??'—'}번째 스와이프 · ${point.store}`:'';
}
function renderNavigation(){
 const steps=$('detail-levels');steps.replaceChildren();['1 업종','2 세부분류','3 가게'].forEach((name,i)=>{const b=element('button','',name);b.type='button';b.dataset.detail=String(i+1);b.setAttribute('aria-pressed',String(level()===i+1));b.disabled=loading||offline;b.onclick=()=>{if(i+1!==level())load(i+1,view);};steps.append(b);});
 $('back').disabled=loading||offline||level()===1;$('reset').disabled=loading||offline||!DATA;
 for(const id of ['zoom-in','zoom-out','fit'])$(id).disabled=!DATA||loading;
}
function renderList(){
 const list=$('scope-list');list.replaceChildren();$('scope-title').textContent={1:'전체 업종',2:'전체 세부분류',3:'전체 가게'}[level()];
 $('scope-count').textContent=`${nodes().length}${level()===3?'곳':'개 분류'}`;
 const fragment=document.createDocumentFragment();nodes().forEach((n,i)=>{const li=element('li'),b=element('button','node-button');b.type='button';b.dataset.nodeIndex=String(i);b.disabled=loading||offline;b.append(element('span','node-name',n.name),element('span','node-meta',level()===3?'가게 정보':`${n.count}곳`),element('span','node-arrow','›'));b.onclick=()=>choose(n);li.append(b);fragment.append(li);});list.append(fragment);
 list.scrollTop=0;
}
function render(data,nextView={x:0,y:0,w:100}){
 const wasEnd=!DATA||Number($('scrub').value)>=Number($('scrub').max),oldStep=Number($('scrub').value)||1;DATA=data;
 $('identity').textContent=offline?'저장된 예시 데이터':data.name||'현재 세션';$('headline').textContent=data.headline||'나의 취향을 살펴보세요';
 const drift=data.drift?` · 지도상 이동(좋아요 ${data.drift.window}개 전): ${data.drift.from_region??''} → ${data.drift.to_region??''}`:'';
 $('sub').innerHTML=`스와이프 ${Number(data.swipes)||0}회 · 좋아요 <b>${Number(data.likes)||0}</b>${esc(drift)}`;
 const max=Math.max(1,(data.trail||[]).length);$('scrub').max=max;$('scrub').value=wasEnd?max:Math.min(oldStep,max);$('scrub').disabled=(data.trail||[]).length<2;
 const near=$('near');near.replaceChildren();for(const item of data.now?.near||[]){const b=element('button','',item.name);b.type='button';b.disabled=offline||item.card_id==null;b.onclick=()=>showStore(item.card_id);near.append(b);}if(!near.children.length)near.append(element('span','','좋아요한 곳이 아직 없어요'));
 $('status').textContent=nodes().length?'':'이 단계에는 표시할 항목이 없어요.';$('retry').hidden=true;view={...nextView};fitted={...view};renderNavigation();renderList();draw();
}
async function load(detail,nextView=view){
 if(offline)return;const token=++requestVersion;controller?.abort();controller=new AbortController();loading=true;nextView={...nextView};retryTarget={detail,nextView};$('status').textContent='지도를 불러오고 있어요…';$('retry').hidden=true;$('scope').setAttribute('aria-busy','true');renderNavigation();
 try {const params=new URLSearchParams({detail:String(detail)});const response=await fetch(endpoint()+'?'+params,{signal:controller.signal});if(!response.ok)throw new Error(response.status===404?'사용자·세션을 찾을 수 없어요.':'지도를 불러오지 못했어요. 다시 시도해 주세요.');const d=await response.json();if(token!==requestVersion)return;if(DATA)levelViews[level()]={...view};loading=false;render(d,nextView);}
 catch(error){if(token!==requestVersion||error.name==='AbortError')return;$('status').textContent=error.message;$('retry').hidden=false;if(!DATA)$('headline').textContent='취향을 불러오지 못했어요';}
 finally {if(token===requestVersion){loading=false;$('scope').setAttribute('aria-busy','false');renderNavigation();}}
}
function choose(n){if(offline||loading||!n)return;if(level()===3){if(n.card_id!=null)showStore(n.card_id);}else {const w=Math.min(100,Math.max(level()===1?8:2.4,Number(n.r)*280||view.w*.45));load(level()+1,{x:n.x*100-w/2,y:n.y*100-w/2,w});}}
function price(menu){return typeof menu.price_text==='string'&&menu.price_text.trim()?menu.price_text:typeof menu.price==='number'&&Number.isFinite(menu.price)?menu.price.toLocaleString('ko-KR')+'원':'가격 정보 없음';}
async function showStore(cardId){
 if(offline||cardId==null)return;const token=++cardVersion;cardController?.abort();cardController=new AbortController();const dialog=$('store-dialog'),box=$('store-content');box.replaceChildren(element('div','detail-content','가게 정보를 불러오고 있어요…'));if(!dialog.open)dialog.showModal();
 try{const response=await fetch('/cards/'+encodeURIComponent(cardId)+'?reviews=0',{signal:cardController.signal});if(!response.ok)throw new Error('가게 정보를 불러오지 못했어요.');const card=await response.json();if(token!==cardVersion)return;box.replaceChildren();const image=safeImageURL(card.image);if(image){const img=element('img','detail-image');img.alt=(card.store?.name||'가게')+' 대표 이미지';img.referrerPolicy='no-referrer';img.onerror=()=>img.remove();img.src=image;box.append(img);}
 const body=element('div','detail-content'),s=card.store||{};body.append(element('p','detail-category',s.category||''),element('h2','',s.name||'가게 정보'),element('p','detail-address',s.location||'주소 정보 없음'));if(s.summary)body.append(element('p','detail-summary',s.summary));
 const menus=(card.menus||[]).slice(0,5);if(menus.length){body.append(element('h3','detail-menu-title','메뉴'));const list=element('ul','detail-menu-list');for(const m of menus){const li=element('li');li.append(element('strong','',m.name||'메뉴'),element('span','',price(m)));list.append(li);}body.append(list);if(card.menus.length>5)body.append(element('p','detail-footnote',`등록된 ${card.menus.length}개 메뉴 중 처음 5개`));}else body.append(element('p','detail-footnote','등록된 메뉴 정보가 없어요.'));box.append(body);
 }catch(error){if(token!==cardVersion||error.name==='AbortError')return;const body=element('div','detail-content',error.message),b=element('button','node-button','다시 불러오기');b.onclick=()=>showStore(cardId);body.append(b);box.replaceChildren(body);}
}
$('close-store').onclick=()=>$('store-dialog').close();$('store-dialog').addEventListener('close',()=>{cardVersion++;cardController?.abort();});
$('store-dialog').addEventListener('click',event=>{if(event.target===$('store-dialog')){const b=event.target.getBoundingClientRect();if(event.clientX<b.left||event.clientX>b.right||event.clientY<b.top||event.clientY>b.bottom)event.target.close();}});
$('back').onclick=goBack;$('reset').onclick=()=>load(1,{x:0,y:0,w:100});$('retry').onclick=()=>{if(retryTarget)load(retryTarget.detail,retryTarget.nextView);};
$('zoom-in').onclick=()=>{if(!offline&&level()<3){const n=nearestNode();if(n)choose(n);}else zoom(1.4);};$('zoom-out').onclick=()=>{if(!offline&&level()>1&&view.w>=fitted.w*.85)goBack();else zoom(1/1.4);};$('fit').onclick=fitView;$('scrub').oninput=draw;
$('map').addEventListener('click',event=>{if(dragMoved)return;const el=event.target.closest('[data-node-index]');if(el)choose(nodes()[Number(el.dataset.nodeIndex)]);});
$('map').addEventListener('keydown',event=>{if(event.key!=='Enter'&&event.key!==' ')return;const el=event.target.closest('[data-node-index]');if(el){event.preventDefault();choose(nodes()[Number(el.dataset.nodeIndex)]);}});
$('map').addEventListener('wheel',event=>{if(!DATA)return;event.preventDefault();const p=new DOMPoint(event.clientX,event.clientY).matrixTransform(event.currentTarget.getScreenCTM().inverse());zoom(Math.exp(-clamp(event.deltaY,-160,160)*.004),clamp((p.x-view.x)/view.w,0,1),clamp((p.y-view.y)/view.w,0,1));},{passive:false});
$('map').addEventListener('pointerdown',event=>{if(!DATA||event.isPrimary===false||event.button!==0)return;dragMoved=false;drag={id:event.pointerId,x:event.clientX,y:event.clientY,view:{...view}};});
$('map').addEventListener('pointermove',event=>{if(!drag||drag.id!==event.pointerId)return;const dx=event.clientX-drag.x,dy=event.clientY-drag.y;if(!dragMoved&&Math.hypot(dx,dy)<7)return;dragMoved=true;event.currentTarget.setPointerCapture(event.pointerId);const b=event.currentTarget.getBoundingClientRect();view={x:drag.view.x-dx/Math.min(b.width,b.height)*drag.view.w,y:drag.view.y-dy/Math.min(b.width,b.height)*drag.view.w,w:drag.view.w};draw();});
for(const event of ['pointerup','pointercancel','lostpointercapture'])$('map').addEventListener(event,()=>{drag=null;});
if(offline){$('offline-label').hidden=false;$('navigation').hidden=true;$('scope').hidden=true;render(DEMO);}
else if(q.get('user_id'))load([1,2,3].includes(Number(q.get('detail')))?Number(q.get('detail')):1,{x:0,y:0,w:100});
else{$('headline').textContent='사용자 정보가 필요해요';$('status').textContent='사용자와 세션이 연결된 취향 지도 주소로 열어 주세요.';}

</script>
