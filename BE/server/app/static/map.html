<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>맛추리 취향 지형도</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#0f1116; color:#e6e8ec; font-family:'Malgun Gothic',system-ui,sans-serif;
         font-size:13px; line-height:1.5; height:100vh; display:flex; flex-direction:column;
         overflow:hidden; }
  a { color:#5b8cff; text-decoration:none; }
  header { padding:12px 20px; border-bottom:1px solid #21252e; flex-shrink:0;
           display:flex; align-items:baseline; gap:16px; flex-wrap:wrap; }
  header h1 { font-size:16px; letter-spacing:.5px; }
  header .stats { display:flex; gap:16px; margin-left:auto; flex-wrap:wrap; }
  header .stat b { color:#fff; font-size:14px; } header .stat span { color:#7d838f; font-size:11px; }
  #wrap { display:flex; flex:1; min-height:0; }

  /* ── 사용자 목록 (관리자 화면과 같은 규칙) ─────────────────────────── */
  #side { width:214px; flex-shrink:0; border-right:1px solid #21252e; overflow-y:auto; }
  #side h2 { font-size:11px; color:#7d838f; padding:12px 14px 6px; letter-spacing:.5px; }
  .u { padding:8px 14px; border-bottom:1px solid #191d25; cursor:pointer; }
  .u.on { background:#1c2230; border-left:2px solid #5b8cff; padding-left:12px; }
  .u .id { font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .u .meta { color:#7d838f; font-size:11px; display:flex; gap:8px; margin-top:2px; }
  .bar-mini { height:3px; background:#252a34; border-radius:2px; margin-top:5px; overflow:hidden; }
  .bar-mini i { display:block; height:100%; background:#4ade80; }

  /* ── 캔버스 ─────────────────────────────────────────────────────── */
  #stage { flex:1; position:relative; min-width:0; overflow:hidden; }
  #cv { display:block; width:100%; height:100%; cursor:grab; }
  #cv.drag { cursor:grabbing; }
  .ov { position:absolute; background:rgba(15,17,22,.82); border:1px solid #222732;
        border-radius:8px; padding:8px 10px; font-size:11px; backdrop-filter:blur(2px); }
  #legend { left:12px; top:12px; max-width:220px; }
  #legend .lrow { display:flex; align-items:center; gap:6px; margin-top:3px; color:#aeb4c0; }
  #legend i { width:9px; height:9px; border-radius:2px; flex-shrink:0; display:block; }
  #legend .ttl { color:#7d838f; font-size:10.5px; letter-spacing:.3px; }
  #legend .grad { height:9px; border-radius:2px; margin:5px 0 3px;
                  background:linear-gradient(90deg,#16181f,#282a54,#5b3a76,#a1416c,#e06b3c,#ffd166); }
  #tools { right:12px; top:12px; display:flex; flex-direction:column; gap:6px; align-items:flex-start; }
  #tools label { display:flex; align-items:center; gap:6px; color:#aeb4c0; cursor:pointer; }
  #stat { left:12px; bottom:12px; color:#8a9099; max-width:60%; }
  #stat b { color:#c9cfda; }
  #tip { position:absolute; pointer-events:none; display:none; z-index:5; max-width:280px;
         background:#161a21; border:1px solid #2f3541; border-radius:8px; padding:7px 10px;
         font-size:11.5px; box-shadow:0 6px 20px rgba(0,0,0,.5); }
  #tip b { font-size:12.5px; } #tip .s { color:#7d838f; font-size:10.5px; }
  #tip .p { color:#aeb4c0; margin-top:3px; }
  button { background:#1b2029; color:#c9cfda; border:1px solid #2f3541; border-radius:6px;
           padding:4px 9px; font-size:11px; cursor:pointer; font-family:inherit; }
  button:hover { background:#232a36; } button:disabled { opacity:.45; cursor:default; }
  button.go { background:#1e3a2a; border-color:#2c6b45; color:#7fe0a5; }
  button.no { background:#3a1e1e; border-color:#6b2c2c; color:#f5a3a3; }

  /* ── 오른쪽 패널 ─────────────────────────────────────────────────── */
  #panel { width:336px; flex-shrink:0; border-left:1px solid #21252e; overflow-y:auto;
           padding:12px 14px 30px; }
  #panel section { margin-bottom:18px; }
  h3 { font-size:11.5px; color:#9aa1ad; margin-bottom:8px; letter-spacing:.4px;
       display:flex; align-items:baseline; gap:6px; }
  h3 small { color:#5c626e; font-weight:400; font-size:10px; }
  .hint { color:#5c626e; font-size:10.5px; margin-top:5px; line-height:1.6; }
  .empty { color:#7d838f; padding:26px 0; text-align:center; line-height:2; font-size:11.5px; }
  .srow { display:flex; align-items:center; gap:7px; height:20px; font-size:11px; }
  .srow .lab { width:56px; text-align:right; color:#aeb4c0; flex-shrink:0; white-space:nowrap;
               overflow:hidden; text-overflow:ellipsis; }
  .srow input[type=range] { flex:1; min-width:0; height:3px; accent-color:#5b8cff; }
  .srow .v { width:46px; text-align:right; color:#7d838f; font-size:10.5px; flex-shrink:0; }
  .srow .v.mod { color:#f0a868; }
  .swipe { background:#161a21; border:1px solid #222732; border-radius:8px; padding:9px 10px; }
  .swipe .nm { font-weight:600; font-size:13px; }
  .swipe .sub { color:#7d838f; font-size:10.5px; margin-top:1px; }
  .swipe .why { color:#c9cfda; font-size:11px; margin-top:6px; border-left:2px solid #3b6bd6;
                padding-left:7px; }
  .swipe .btns { display:flex; gap:8px; margin-top:9px; }
  .swipe .btns button { flex:1; padding:7px; font-size:12px; font-weight:600; }
  .delta { display:flex; flex-direction:column; gap:2px; margin-top:7px; font-size:10.5px;
           color:#8a9099; }
  .delta u { text-decoration:none; color:#c9cfda; }
  .scrub { display:flex; align-items:center; gap:8px; }
  .scrub input[type=range] { flex:1; accent-color:#5b8cff; }
  .tops { display:flex; flex-direction:column; gap:4px; }
  .tp { display:flex; align-items:center; gap:7px; background:#161a21; border:1px solid #222732;
        border-radius:6px; padding:5px 8px; cursor:pointer; }
  .tp.on { border-color:#3b6bd6; background:#182034; }
  .tp .rk { width:16px; color:#7d838f; font-size:10.5px; flex-shrink:0; }
  .tp .nm { flex:1; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
            font-size:11.5px; }
  .tp .sc { color:#8a9099; font-size:10.5px; flex-shrink:0; }
  .links { margin-top:6px; display:flex; flex-direction:column; gap:5px; }
  .lk { background:#141821; border-left:2px solid #3b6bd6; border-radius:5px; padding:5px 8px; }
  .lk .h { display:flex; gap:6px; align-items:baseline; font-size:11px; }
  .lk .h b { color:#e6e8ec; } .lk .h span { color:#7d838f; font-size:10px; margin-left:auto; }
  .lk .q { color:#9aa1ad; font-size:10.5px; margin-top:2px; line-height:1.5; }
  .lk .k { color:#5c626e; font-size:9.5px; margin-top:2px; }
  select { background:#1b2029; color:#e6e8ec; border:1px solid #384252; border-radius:6px; padding:5px; font:inherit; }
  .change-head { font-size:18px; font-weight:700; margin:7px 0; }
  .change-metrics { display:flex; gap:10px; margin:10px 0; }
  .change-metrics > div { flex:1; padding:9px; background:#1b2230; border-radius:8px; }
  .change-metrics b { display:block; font-size:22px; color:#fff; }
  .change-metrics span { font-size:10px; color:#aeb4c0; }
  .mover { display:flex; justify-content:space-between; gap:8px; padding:4px 0; font-size:11px; cursor:pointer; }
  .mover span:first-child { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .mover span:last-child { white-space:nowrap; }
  .rise { color:#49dbc2; } .fall { color:#f7a46b; }
  #panel .hint { color:#929bad; }
  .warn { color:#e2c07a; font-size:10.5px; margin-top:5px; }
  /* 비교 → 반응 → 결과를 한 시야에서 읽는다. 모델 실험은 아래에 접어 둔다. */
  header { align-items:center; padding:12px 18px; }
  header h1 { font-size:18px; letter-spacing:-.5px; }
  #side { width:178px; background:#11151d; }
  #user-search { width:calc(100% - 20px); margin:4px 10px 10px; padding:8px; }
  input[type=search], input[type=number] { background:#161d29; color:#e6e8ec; border:1px solid #384252; border-radius:6px; font:inherit; }
  #workspace { flex:1; min-width:0; display:flex; flex-direction:column; }
  #context { padding:16px 22px; border-bottom:1px solid #28303d; background:#141a24; }
  .eyebrow { font-size:10px; letter-spacing:1px; color:#9aa9c0; text-transform:uppercase; }
  .context-title { display:flex; align-items:center; gap:10px; margin:4px 0 12px; }
  .context-title strong { font-size:20px; letter-spacing:-.7px; }
  .badge { border:1px solid #3d526a; color:#b8c9e0; border-radius:20px; padding:2px 8px; font-size:10px; }
  .controls { display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
  .controls input { width:63px; padding:5px; }
  .controls label { color:#a8b4c6; font-size:11px; }
  #stage { min-height:240px; }
  #timeline { padding:12px 22px; background:#141a24; border-top:1px solid #28303d; }
  .timeline-head { display:flex; justify-content:space-between; gap:12px; color:#c6cfdd; font-size:11px; }
  .reactions { display:flex; gap:4px; margin:10px 0; }
  .reaction { flex:1; min-width:0; padding:5px 0; border-radius:4px; position:relative; }
  .reaction.like { color:#80e7c9; border-color:#31584f; background:#19332e; }
  .reaction.dislike { color:#f9b99a; border-color:#614337; background:#32231f; }
  .reaction.outside { opacity:.38; }
  .reaction.on { outline:2px solid #e6e8ec; outline-offset:1px; }
  .reaction .rn { display:block; font-size:9px; }
  #panel { width:380px; padding:18px; background:#11151d; }
  #panel section { padding-bottom:16px; margin-bottom:16px; border-bottom:1px solid #252d3a; }
  h3 { color:#d0d9e8; font-size:12px; letter-spacing:0; justify-content:space-between; }
  h3 .seq { color:#71839b; font-size:10px; }
  .summary-copy { font-size:13px; color:#dae3ef; line-height:1.7; }
  .change-metrics { gap:8px; }
  .change-metrics > div { border:1px solid #2a3545; padding:10px; background:#192130; }
  .change-metrics b { font-size:25px; font-weight:600; }
  .change-metrics small { font-size:12px; color:#aab8cb; font-weight:400; }
  .change-metrics span { display:block; font-size:11px; }
  .tabs { display:flex; gap:4px; margin-bottom:7px; }
  .tabs button { flex:1; padding:6px 4px; }
  .tabs button.active { color:#def8ef; background:#233e3a; border-color:#427369; }
  .mover { width:100%; border:0; border-bottom:1px solid #232c39; border-radius:0; padding:8px 4px; background:transparent; text-align:left; }
  .mover.on { background:#202d3b; border-radius:5px; }
  .mover .movement { font-size:10px; display:block; color:#9aa9bc; }
  .mover .rank { text-align:right; }
  .focus-name { font-size:17px; font-weight:600; margin-bottom:5px; }
  .rank-track { position:relative; height:22px; margin:12px 6px 0; border-top:3px solid #344255; }
  .rank-track i { position:absolute; top:-7px; width:11px; height:11px; border-radius:50%; transform:translateX(-50%); border:2px solid #99a9c0; background:#141a24; }
  .rank-track i.after { border-color:#72e4c9; background:#72e4c9; }
  .rank-track .join { position:absolute; top:-3px; height:3px; background:#72e4c9; }
  .rank-ends { display:flex; justify-content:space-between; color:#8c9bb2; font-size:10px; }
  .rank-pair { font-size:19px; font-weight:600; margin:8px 0; }
  .rank-pair small { font-size:11px; color:#91a2b9; font-weight:400; }
  .part-row { display:grid; grid-template-columns:68px 1fr 55px; gap:6px; align-items:center; font-size:11px; margin:4px 0; }
  .part-track { height:7px; position:relative; background:linear-gradient(90deg,transparent 49.5%,#778498 50%,transparent 50.5%); }
  .part-track i { position:absolute; top:0; height:7px; border-radius:2px; }
  .part-row b { text-align:right; font-weight:500; }
  details { margin-top:12px; }
  summary { cursor:pointer; color:#a9b7cb; font-size:11px; }
  .notice { padding:8px 10px; margin:8px 0; border-left:2px solid #ddae67; background:#2b251d; color:#e9ca9c; font-size:11px; }
  .scope { color:#8ea0b8; font-size:10px; margin-top:9px; }
  .hint { color:#8a97ab; }
  #legend { max-width:210px; }
  #stat { max-width:75%; }
  #tools summary { margin-bottom:6px; }
  #focus-loading { color:#9aa9bc; padding:12px 0; }
  #map-depth { padding:9px 16px; background:#171e29; border-bottom:1px solid #2a3442;
    display:flex; gap:10px; align-items:center; justify-content:space-between; flex-wrap:wrap; }
  .depth-steps,.depth-actions,#browse-path { display:flex; gap:5px; align-items:center; flex-wrap:wrap; }
  .depth-steps button { background:transparent; color:#8e9eb5; border-color:transparent; }
  .depth-steps button.active { background:#26473f; color:#a4efd9; border-color:#416f60; }
  .depth-steps span { color:#607089; } #depth-caption { color:#9aa9be; font-size:10px; }
  #browse-path { margin-bottom:10px; color:#7387a1; font-size:11px; }
  #browse-path button { border:0; padding:3px 0; background:transparent; color:#bdd9f3; }
  .category-row { display:grid; grid-template-columns:minmax(0,1fr) auto; gap:5px; width:100%;
    padding:10px; margin-top:5px; background:#182330; border-color:#2b3a4e; text-align:left; }
  .category-row .category-name { font-size:12px; color:#e0e8f2; font-weight:600; overflow-wrap:anywhere; }
  .category-row .category-meta { color:#95a6bd; font-size:10px; display:block; margin-top:3px; }
  .category-row .category-score { text-align:right; white-space:nowrap; font-size:15px; }
  .category-row .category-score small { display:block; font-size:10px; }
  .category-meter { display:block; height:3px; background:#2c3b4d; margin-top:7px; }
  .category-meter i { display:block; height:3px; background:#7bb5d8; }
  #hierarchy-list { max-height:330px; overflow:auto; padding-right:3px; }
  #hierarchy-detail .scope { margin-top:0; }
  #panel-body { display:flex; flex-direction:column; }
  #panel-body > * { flex-shrink:0; }
  #hierarchy-detail { order:-3; }
  #panel[data-depth="2"] #hierarchy-list { max-height:140px; }
  #panel[data-depth="2"] #focus-detail { order:-2; }
  #panel[data-depth="0"] #candidate-changes, #panel[data-depth="1"] #candidate-changes,
  #panel[data-depth="0"] #focus-detail, #panel[data-depth="1"] #focus-detail { display:none; }
  @media (max-width:1200px) {
    #side { width:146px; } #panel { width:324px; padding:14px; }
    #context,#timeline { padding:12px 14px; } header .stat:nth-child(2) { display:none; }
  }
  @media (max-width:850px) {
    body { overflow:auto; height:auto; min-height:100vh; }
    #wrap { display:grid; grid-template-columns:130px minmax(0,1fr); overflow:visible; }
    #side { width:auto; grid-row:1 / 3; max-height:100vh; position:sticky; top:0; }
    #workspace { min-height:660px; } #panel { width:auto; border-top:1px solid #28303d; overflow:visible; }
    header .stats { display:none; } #legend { max-width:180px; } #stat { max-width:95%; }
  }
</style>
</head>
<body>
<header>
  <h1>취향 변화 지도</h1>
  <a href="/admin">관리자 화면</a>
  <a href="/docs">API 문서</a>
  <div class="stats" id="stats"></div>
</header>

<div id="wrap">
  <aside id="side">
    <h2>사용자 <span id="ucount"></span></h2>
    <input id="user-search" type="search" placeholder="이름·ID 검색" aria-label="사용자 검색">
    <div id="users"></div>
  </aside>

  <main id="workspace">
  <div id="context"><div class="eyebrow">TASTE OBSERVATORY</div><div class="context-title"><strong>취향이 바뀌는 순간을 읽습니다</strong></div><div class="hint">사용자를 선택하면 같은 가게들의 전후 순위와 반응 이력을 비교합니다.</div></div>
  <nav id="map-depth" aria-label="취향 지도 상세 단계">
    <div class="depth-steps"><button data-depth="0" class="active">큰 업종 · cat2</button><span>›</span><button data-depth="1">세부 업종 · cat3</button><span>›</span><button data-depth="2">가게</button></div>
    <div class="depth-actions"><span id="depth-caption">확대하면 더 자세히 보입니다</span><button id="zoom-out" aria-label="지도 축소">−</button><button id="zoom-in" aria-label="지도 확대">＋</button></div>
  </nav>
  <div id="stage">
    <canvas id="cv"></canvas>
    <div id="legend" class="ov"></div>
    <div id="tools" class="ov">
      <select id="color-mode" aria-label="지도 색상"><option value="change">취향 변화</option><option value="score">현재 순위</option></select>
      <label><input type="checkbox" id="trace-toggle" checked> 취향 변화 경로</label>
      <details><summary>지도 표시</summary><label><input type="checkbox" id="edges"> 실제 유사도 이웃 선</label>
      <label><input type="checkbox" id="pins"> 좋아요·별로 핀</label>
      <label><input type="checkbox" id="links-toggle"> 현재 유사 근거 연결선</label></details>
      <button id="reset">화면 맞춤</button>
    </div>
    <div id="stat" class="ov"></div>
    <div id="tip"></div>
  </div>
  <div id="timeline"><div class="hint">최근 반응을 클릭하면 그 한 번의 전후 변화로 이동합니다.</div></div>
  </main>

  <aside id="panel">
    <div id="panel-body"><div class="empty">왼쪽에서 사용자를 고르면<br>지형도에 그 사람의 점수가 얹힙니다.</div></div>
  </aside>
</div>

<script>
const $ = (s) => document.querySelector(s);
const fmt = (n) => n == null ? '-' : (typeof n === 'number' ? n.toLocaleString('ko-KR') : n);
const pct = (n) => n == null ? '-' : Math.round(n * 100) + '%';
const sig = (n) => (n >= 0 ? '+' : '') + Number(n).toFixed(2);
const clamp = (v, a, b) => v < a ? a : (v > b ? b : v);
function esc(s) { return String(s == null ? '' : s)
  .replace(/[<>&"]/g, c => ({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c])); }

async function api(p) {
  const r = await fetch(p);
  if (!r.ok) throw new Error(p + ' -> ' + r.status);
  return r.json();
}

/* 업종 색. 지도의 범례는 **빈도 상위 10개 + 기타** 다 — 20종을 다 칠하면 구분이 안 된다. */
const PALETTE = ['#5b8cff','#f59e0b','#22d3ee','#c084fc','#f472b6','#facc15',
                 '#4ade80','#fb923c','#2dd4bf','#e879f9'];
const OTHER = '#6b7280';
const LEGEND_N = 10;
const catColor = (ci) => ci < LEGEND_N ? PALETTE[ci] : OTHER;

/* 슬라이더가 걷는 범위. 학습값은 이 밖으로 나갈 수 있다(그때는 막대가 끝에 붙는다). */
const W_MIN = -1.5, W_MAX = 2;

/* 점수 램프 — 낮은 쪽이 배경으로 잠기고(어둡고 투명) 높은 쪽이 타오른다. */
const RAMP = [[0.00,[22,24,31]],[0.22,[40,42,84]],[0.44,[91,58,118]],
              [0.64,[161,65,108]],[0.82,[224,107,60]],[1.00,[255,209,102]]];
function ramp(t) {
  t = clamp(t, 0, 1);
  for (let i = 1; i < RAMP.length; i++) {
    if (t <= RAMP[i][0]) {
      const [a, ca] = RAMP[i - 1], [b, cb] = RAMP[i];
      const f = (t - a) / (b - a || 1);
      return [0, 1, 2].map(k => Math.round(ca[k] + (cb[k] - ca[k]) * f));
    }
  }
  return RAMP[RAMP.length - 1][1];
}

/* ───────── 상태 ───────── */
let L = null;                 // 지형도 (한 번만 읽는다)
let U = null;                 // 지금 그려진 사용자 응답
let current = null;           // recommendation session ID (legacy user_id)
let overrideOn = false;       // 슬라이더를 건드렸는가
let sliderVals = null;        // 성분 순서 그대로의 배열
let uptoVal = null;           // 이력 스크러버 (null = 지금)
let selTop = 0;               // 강조 중인 상위 카드

    for (let j = 0; j < L.nbr[i].length; j++) {

function pin(X, Y, color, halo) {

  ctx.closePath(); ctx.fill(); ctx.stroke();

}

function drawPins() {

function tracePoints() {

}
function drawTrace() {
  const points=tracePoints(); if(!points.length) return;
  ctx.save();
  for(let j=1;j<points.length;j++) {
    const a=points[j-1], b=points[j];
    if(a.idx==null||b.idx==null||a.idx===b.idx) continue;
    const x=sx(L.x[a.idx]),y=sy(L.y[a.idx]),x2=sx(L.x[b.idx]),y2=sy(L.y[b.idx]);
    const dx=x2-x,dy=y2-y,len=Math.hypot(dx,dy),f=j/(points.length-1);
    const color=`rgb(${Math.round(168-73*f)},${Math.round(145+85*f)},${Math.round(246-40*f)})`;
    ctx.strokeStyle='#0f1116';ctx.lineWidth=6;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x2,y2);ctx.stroke();
    ctx.strokeStyle=color;ctx.lineWidth=2.5;ctx.stroke();
    if(len>30) {
      const mx=x+dx*.62,my=y+dy*.62,ux=dx/len,uy=dy/len;
      ctx.fillStyle=color;ctx.beginPath();ctx.moveTo(mx+ux*7,my+uy*7);
      ctx.lineTo(mx-ux*5-uy*4,my-uy*5+ux*4);ctx.lineTo(mx-ux*5+uy*4,my-uy*5-ux*4);ctx.closePath();ctx.fill();
    }
  }
  const nodes=new Map(); points.forEach(p=>{if(p.idx!=null){if(!nodes.has(p.idx))nodes.set(p.idx,[]);nodes.get(p.idx).push(p.n);}});
  const labels=[];
  for(const [i,ns] of nodes) {
    const x=sx(L.x[i]),y=sy(L.y[i]),current=ns.includes(U.upto??U.prefs);
    ctx.fillStyle=current?'#ffe08a':'#bfa8ff';ctx.strokeStyle='#151923';ctx.lineWidth=2;
    ctx.beginPath();ctx.arc(x,y,current?8:6,0,Math.PI*2);ctx.fill();ctx.stroke();
    const label=(ns.length>2?ns[0]+'…'+ns.at(-1):ns.join('·'))+'회';
    ctx.font='bold 11px system-ui,sans-serif';ctx.textAlign='left';ctx.textBaseline='middle';
    const width=ctx.measureText(label).width;
    const options=[[11,-12],[11,14],[-width-11,-12],[-width-11,14],[11,-30],[11,32]]
      .map(([dx,dy])=>({x:clamp(x+dx,4,W-width-4),y:clamp(y+dy,12,H-12),w:width}));
    const box=options.find(b=>labels.every(a=>b.x+b.w+5<a.x || a.x+a.w+5<b.x || Math.abs(b.y-a.y)>17)) || options.at(-1);
    labels.push(box);
    ctx.lineWidth=4;ctx.strokeStyle='#10141c';ctx.strokeText(label,box.x,box.y);
    ctx.fillStyle=current?'#ffe08a':'#dacfff';ctx.fillText(label,box.x,box.y);

}
function pickTrace(mx,my) {

/* 연결선 — 상위 카드에서 '그 성분을 밀어올린 좋아요 가게' 로. 라벨은 맞은 쌍의 문장. */
function drawLinks(t) {
  if (!U || !U.top.length) return;
  const c = U.top.find(c=>c.idx===focusIdx);
  if (!c || !c.links.length) return;
  const X = sx(L.x[c.idx]), Y = sy(L.y[c.idx]);
  ctx.save();
  ctx.globalAlpha = t;
  ctx.font = '10.5px system-ui,sans-serif'; ctx.textBaseline = 'middle';
  c.links.slice(0, 4).forEach((lk, n) => {
    const X2 = sx(L.x[lk.idx]), Y2 = sy(L.y[lk.idx]);
    const mx = (X + X2) / 2, my = (Y + Y2) / 2;
    const dx = X2 - X, dy = Y2 - Y, len = Math.hypot(dx, dy) || 1;
    const bend = (clamp(len * 0.16, 14, 54) + n * 11) * (n % 2 ? -1 : 1);
    const cx = mx - dy / len * bend, cy = my + dx / len * bend;
    ctx.strokeStyle = '#ffd166'; ctx.lineWidth = 1.3;
    ctx.beginPath(); ctx.moveTo(X, Y); ctx.quadraticCurveTo(cx, cy, X2, Y2); ctx.stroke();
    ctx.fillStyle = '#4ade80';
    ctx.beginPath(); ctx.arc(X2, Y2, 3.4, 0, 6.2832); ctx.fill();
    const lx = (X + 2 * cx + X2) / 4, ly = (Y + 2 * cy + Y2) / 4;
    const label = lk.name + (lk.pair ? ' · ' + lk.pair[0].slice(0, 22) : '');
    const w = ctx.measureText(label).width + 10;
    ctx.fillStyle = 'rgba(15,17,22,.86)'; ctx.strokeStyle = '#3a4152'; ctx.lineWidth = 1;
    ctx.beginPath();

    ctx.fill(); ctx.stroke();

  });
  ctx.restore();
}

function showTip(i, mx, my) {

let dragging = null, dragMoved = false;

});

  const mx = e.offsetX, my = e.offsetY;
  if (dragging) {
    view.tx = dragging.tx + (mx - dragging.x); view.ty = dragging.ty + (my - dragging.y);
    if (Math.abs(mx - dragging.x) + Math.abs(my - dragging.y) > 3) dragging.moved = dragMoved = true;
    $('#tip').style.display = 'none'; schedule(); return;
  }
  const group=pickGroup(mx,my);
  hoverGroup=group;
  if(group&&group.store==null) {
    hoverIdx=-1;hoverTrace=null;hoverTop=null;$('#tip').style.display='none';schedule();return;
  }
  const i = group?.store ?? pick(mx, my);
  hoverTrace=pickTrace(mx,my);
  if(hoverTrace) {
    hoverIdx=hoverTrace.idx;schedule();showTip(hoverTrace.idx,mx,my);
    $('#tip').innerHTML=`<b>${hoverTrace.n}회 · 취향 대표 가게</b><div class="p">${esc(L.name[hoverTrace.idx])}<br>클릭하면 이 시점으로 이동합니다.<br>상위 개인화 후보의 고차원 유사도로 고른 대표입니다.</div>`;
    return;
  }
  const n = (U && i >= 0) ? U.top.findIndex(c => c.idx === i) : -1;
  const ht = n >= 0 ? n : null;
  if (i !== hoverIdx || ht !== hoverTop) { hoverIdx = i; hoverTop = ht; schedule(); }
  showTip(i, mx, my);
});

  const wx = (e.offsetX - view.tx) / view.k, wy = (e.offsetY - view.ty) / view.k;
  view.k = nk; view.tx = e.offsetX - wx * nk; view.ty = e.offsetY - wy * nk;
  schedule();
}, { passive: false });

function query() {
  const q = [];
  if (overrideOn && sliderVals) q.push('weights=' + sliderVals.map(v => v.toFixed(2)).join(','));
  if (uptoVal != null) q.push('upto=' + uptoVal);
  if (focusIdx != null) q.push('focus=' + focusIdx);
  return q.length ? '?' + q.join('&') : '';
}

async function fetchUser(keepSel) {
  const uid = current, version = ++requestVersion, queryString = query();
  fetchPending = true;
  $('#context').setAttribute('aria-busy', 'true');
  $('#panel-body').style.opacity = '.55';
  try {
  const d = await api('/admin/api/map/user/' + encodeURIComponent(uid) + queryString);
  const at = d.upto ?? d.prefs;
  const baseAt = compareMode === 'previous' ? Math.max(0, at - 1) : compareMode === 'recent' ? Math.max(0,at - (d.history_effect?.half_life_swipes || 10)) : compareMode === 'custom' ? Math.min(at,customFrom) : 0;
  const base = await api('/admin/api/map/user/' + encodeURIComponent(uid) + '?upto=' + baseAt + '&focus=' + d.focus.idx + '&session_id=' + encodeURIComponent(d.session_id));
  if (uid !== current || version !== requestVersion) return;
  if (d.scores.length !== L.count) throw new Error('지도와 후보 수가 다릅니다. 새로고침해 주세요.');
  if (d.session_id !== base.session_id) throw new Error('세션이 변경됐습니다. 다시 불러와 주세요.');
  baseline = base; comparison = compareScores(base.scores, d.scores);
  U = d; U.rank = comparison.after; focusIdx = d.focus.idx;
  if(detailDepth()===2&&!inScope(focusIdx)) {
    browse={cat2:category2(focusIdx),cat3:category3(focusIdx)};
    view.tx=W/2-L.x[focusIdx]*view.k;view.ty=H/2-L.y[focusIdx]*view.k;
  }
  if (!overrideOn) sliderVals = d.weights.map(w => w.w);
  if (!keepSel) selTop = 0;
  setScores(d.scores);
  renderLegend(); renderPanel();
  loadTrace();
  } catch (error) {
    if (version !== requestVersion || uid !== current) return;
    stopPlaying();
    U = null; baseline = null; comparison = null; setScores(null); renderLegend();
    $('#context').innerHTML = '<div class="hint">비교 데이터를 불러오지 못했습니다.</div>';
    $('#timeline').innerHTML = '';
    $('#panel-body').innerHTML = `<div class="empty">${esc(error.message)}<br><button id="retry-user">다시 불러오기</button></div>`;
    $('#retry-user').onclick = () => fetchUser(false);
  } finally { if (version === requestVersion) {
    fetchPending = false; $('#context').setAttribute('aria-busy', 'false');
    $('#panel-body').style.opacity = '1';
  } }
}

async function selectUser(uid) {
  stopPlaying(); clearTimeout(wTimer); requestVersion++;
  U = null; baseline = null; comparison = null; renderLegend(); schedule();
  $('#context').innerHTML = '<div class="hint">사용자의 비교 시점을 불러오는 중…</div>';
  $('#timeline').innerHTML = '';
  current = uid; overrideOn = false; sliderVals = null; uptoVal = null;
  browse={cat2:null,cat3:null};fitView();renderedDepth=-1;
  T=null;traceKey=null;traceVersion++;hoverTrace=null;
  selTop = 0; focusIdx = null; lastDelta = null; qTo = null; qFrom = null;
  document.querySelectorAll('.u').forEach(el =>
    el.classList.toggle('on', decodeURIComponent(el.dataset.id) === uid));
  $('#panel-body').innerHTML = `<div class="empty">불러오는 중…</div>`;
  await fetchUser(false);
}

function setTime(n) { stopPlaying(); clearTimeout(wTimer); uptoVal=n>=U.prefs?null:n; fetchUser(true); }

  $('#panel-body').innerHTML = `<section id="hierarchy-detail"></section>${comparisonBlock()}

    <details><summary>해석 기준 · 최근 반응의 영향</summary><div class="hint">
      두 시점 모두 같은 ${fmt(L.count)}곳을 채점합니다. 1%p는 순위 약 ${((L.count-1)/100).toFixed(1)}곳의 차이입니다. 동점은 평균 순위이며 상위 10곳 경계의 동점은 고정 순서로 정합니다.<br><br>

  renderHierarchy();
}
function comparisonBlock() {
  const c=comparison, at=U.upto??U.prefs;
  const unchanged=c.mean===0;
  return `<section id="taste-change"><h3>변화 요약 <span class="seq">01</span></h3>
    <div class="summary-copy">${unchanged?'순위 변화가 없습니다.':`상위 ${c.size}곳 중 <b>${c.entered}곳</b>이 바뀌었습니다.`}</div>
    <div class="change-head" style="font-size:11px;color:#94a4ba;font-weight:400">${baseline.upto}회 → ${at}회 · 같은 후보의 전후 비교</div>
    <div class="change-metrics"><div><b>${c.entered}<small> / ${c.size}</small></b><span>상위 후보 교체</span></div><div><b>${c.mean.toFixed(1)}<small>%p</small></b><span>전체 평균 순위 이동</span></div></div>
    <div class="hint">${unchanged?'반응이 없거나 반응 후 순서가 유지된 상태입니다.':c.entered===0?'상위 후보는 유지됐습니다. 그 밖의 순위 변화를 확인하세요.':'새로 올라온 후보가 실제 반응과 연결되는지 아래에서 확인하세요.'} 이 수치는 추천의 변화량이며 확신도·결정 준비 점수가 아닙니다.</div>
    ${U.cold?'<div class="notice">좋아요 근거 부족 · 인기·평판과 기피 근거로 채점 중입니다.</div>':baseline.cold?'<div class="notice">이 구간에는 인기·평판 중심에서 개인 취향 채점으로 전환된 효과도 포함됩니다.</div>':''}
    ${overrideOn?'<div class="notice">가중치 실험 중 · 실제 학습 변화와 구분해서 보세요.</div>':''}</section>`;
}
function moversBlock() {
  const c=comparison, entered=c.afterOrder.slice(0,c.size).filter(i=>!c.beforeOrder.slice(0,c.size).includes(i)),
    exited=c.beforeOrder.slice(0,c.size).filter(i=>!c.afterOrder.slice(0,c.size).includes(i));
  const groups=moverMode==='entered'?[[entered.slice(0,2),'진입'],[exited.slice(0,2),'이탈']]:[[c.rises.slice(0,2),'상승'],[c.falls.slice(0,2),'하락']];
  return groups.map(([ids,label])=>ids.map(i=>`<button class="mover ${focusIdx===i?'on':''}" data-idx="${i}">
    <span><span class="${c.delta[i]>=0?'rise':'fall'}">${label}</span> · ${esc(L.name[i])}<small class="movement">${esc(L.cats[L.cat[i]])}${U.like_ids.includes(i)?' · 좋아요':U.dislike_ids.includes(i)?' · 별로':''}</small></span>
    <span class="rank">${fmt(c.before[i]+1)} → ${fmt(c.after[i]+1)}위<small class="movement ${c.delta[i]>=0?'rise':'fall'}">${sig(c.delta[i])}%p</small></span></button>`).join('')).join('') || '<div class="hint">이 구간에서 해당하는 후보 변화가 없습니다.</div>';
}
function focusBlock() {
  if(!U.focus||!baseline.focus||U.focus.idx!==baseline.focus.idx)return '<div class="hint">지도에서 가게를 선택해 주세요.</div>';
  const i=focusIdx, c=comparison, b=c.before[i]+1,a=c.after[i]+1;
  const rows=Object.keys(U.focus.parts).map(key=>({key,delta:U.focus.parts[key]-baseline.focus.parts[key]})).sort((a,b)=>Math.abs(b.delta)-Math.abs(a.delta));
  const max=Math.max(.000001,...rows.map(r=>Math.abs(r.delta)));
  const p0=100*c.before[i]/Math.max(1,L.count-1),p1=100*c.after[i]/Math.max(1,L.count-1);
  return `<h3>선택 가게 · 변화 근거 <span class="seq">03</span></h3>
    <div class="focus-name">${esc(L.name[i])}</div><div class="hint">${esc(category2(i))} › ${esc(category3(i))} · ${U.like_ids.includes(i)?'좋아요한 가게':U.dislike_ids.includes(i)?'별로라고 한 가게':'현재 반응 없음'}</div>
    <div class="rank-pair">${fmt(b)} <small>→</small> ${fmt(a)}위 <small class="${c.delta[i]>=0?'rise':'fall'}">${sig(c.delta[i])}%p</small></div>
    <div class="rank-track"><span class="join" style="left:${Math.min(p0,p1)}%;width:${Math.abs(p1-p0)}%"></span><i style="left:${p0}%" title="기준 ${fmt(b)}위"></i><i class="after" style="left:${p1}%" title="조회 ${fmt(a)}위"></i></div>
    <div class="rank-ends"><span>1위 · 상위</span><span>○ 기준　● 조회</span><span>${fmt(L.count)}위</span></div>
    <h3 style="margin-top:16px">무슨 점수 성분이 바뀌었나 <small>원점수 증감</small></h3>
    ${rows.map(r=>`<div class="part-row"><span>${esc(nameOfKey(r.key))}</span><div class="part-track"><i style="left:${r.delta<0?50-Math.abs(r.delta)/max*50:50}%;width:${Math.abs(r.delta)/max*50}%;background:${r.delta>=0?'#49dbc2':'#f7a46b'}"></i></div><b class="${r.delta>=0?'rise':'fall'}">${sig(r.delta)}</b></div>`).join('')}
    <div class="hint">총점 ${baseline.scores[i].toFixed(2)} → ${U.scores[i].toFixed(2)} (${sig(U.scores[i]-baseline.scores[i])})<br>성분 증감의 합이 총점 변화입니다. 학습 가중치·유사 근거·정규화 변화가 함께 반영되며, 특정 반응 하나의 인과 효과로 분리한 값은 아닙니다.</div>`;
}

function sliderRow(w, j) {
  const val = sliderVals ? sliderVals[j] : w.w;
  const mod = overrideOn && Math.abs(val - w.w) > 0.005;
  const out = val < W_MIN || val > W_MAX;      // 학습값이 슬라이더 밖에 있다
  return `<div class="srow" title="${esc(w.name)} — 학습값 ${sig(w.w)} ± ${w.sd}${
      out ? ' (슬라이더 범위 밖)' : ''}">
    <span class="lab">${esc(w.name)}</span>
    <input type="range" min="${W_MIN}" max="${W_MAX}" step="0.01"
      value="${clamp(val, W_MIN, W_MAX)}" data-j="${j}">
    <span class="v ${mod ? 'mod' : ''}" ${out ? 'style="color:#e2c07a"' : ''}
      >${out ? '↦' : ''}${sig(val)}</span></div>`;
}

function linksBlock(card) {
  if (!card.links.length)
    return `<div class="hint">표시할 현재 세션의 좋아요 연결 사례가 없습니다. 이전 세션 근거는 연결선에서 제외됩니다.</div>`;
  return `<div class="links">` + card.links.map(lk => `
    <div class="lk">
      <div class="h"><b>${esc(lk.name)}</b> ${sig(lk.part)}
        <span>← ${esc(lk.store_name)}</span></div>
      ${lk.pair ? `<div class="q">"${esc(lk.pair[0])}"<br>"${esc(lk.pair[1])}"</div>` : ''}
      ${lk.pair_label ? `<div class="k">${esc(lk.pair_label)}${lk.cos != null ? ` · 코사인 ${lk.cos}` : ''}</div>` : ''}
    </div>`).join('') + `</div>
    <div class="hint">연결선은 그 성분에서 <b style="color:#aeb4c0">가장 닮은 좋아요 사례</b>로 갑니다.</div>`;
}

function deltaBlock() {
  // 학습값은 소수 셋째 자리까지 온다 — 0.001 이 '움직였다' 의 최소 단위다.
  const rows = lastDelta.rows.filter(r => Math.abs(r.after - r.before) >= 0.001)
    .sort((a, b) => Math.abs(b.after - b.before) - Math.abs(a.after - a.before)).slice(0, 5);
  if (!rows.length) return `<div class="delta">가중치가 거의 안 움직였습니다.</div>`;
  return `<div class="delta"><span>방금 ${lastDelta.like ? '♥ 좋아요' : '✕ 별로'} —
    <u>${esc(lastDelta.name)}</u> 로 움직인 가중치</span>` +
    rows.map(r => `<span>${esc(r.name)} ${sig(r.before)} → <u>${sig(r.after)}</u>
      (${sig(r.after - r.before)})</span>`).join('') + `</div>`;
}

/* ───────── 스와이프 (유일한 쓰기) ───────── */
async function swipe(like) {
  if (!U || swiping || fetchPending) return;
  const card = U.top.find(c=>c.idx===focusIdx) || U.top[Math.min(selTop, U.top.length - 1)], uid = current;
  if (!card || card.card_id == null || uptoVal != null) return;
  const weights = U.weights.map(w => w.w);
  swiping = true; renderPanel();
  try {
    const r = await fetch('/preferences', {method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({user_id: uid, session_id: U.session_id, card_id: card.card_id, prefer: like ? 'like' : 'dislike'})});
    if (!r.ok) throw new Error('스와이프 저장 실패 (' + r.status + ')');
    if (uid !== current) return;
    uptoVal = null; selTop = 0;
    await fetchUser(false);
    if (uid !== current || !U) return;
    lastDelta = {like, name: card.name,
      rows: U.weights.map((w, j) => ({name: w.name, before: weights[j], after: w.w}))};
    await loadUsers();
  } catch (error) { alert(error.message); }
  finally { swiping = false; if (U) renderPanel(); }
}

/* 한 응답을 그린 뒤 다음 시점으로 이동한다. 느린 요청끼리 역전되지 않는다. */
function stopPlaying() { playVersion++; if (playing) clearTimeout(playing); playing = null; }
async function play() {
  if (playing) { stopPlaying(); renderPanel(); return; }
  uptoVal = 0;
  const token = ++playVersion;
  async function step() {
    await fetchUser(true);
    if (token !== playVersion || !playing || !U) return;
    if (uptoVal == null || uptoVal >= U.prefs) { stopPlaying(); uptoVal = null; await fetchUser(true); return; }
    playing = setTimeout(() => { uptoVal += 1; step(); }, 800);
  }
  playing = -1;
  await step();
}

/* ───────── 시작 ───────── */
async function start() {
  try {
    L = await api('/admin/api/map/layout');
  } catch (e) {
    document.body.innerHTML = `<div class="empty" style="padding:60px">
      지형도 산출물을 읽지 못했습니다 (${esc(e.message)}).<br>
      <code style="color:#9aa1ad">python -m analysis.build_serving --only layout</code> 로 만드세요.</div>`;
    return;
  }
  buildHierarchy();buildGrid(); resize(); renderLegend(); renderStat();renderHierarchy();
  await loadStats(); await loadUsers();
  $('#edges').addEventListener('change', renderStat);
}
start();
</script>
