<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>맛추리 — 준비 중</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#0f1116; color:#e6e8ec; font-family:'Malgun Gothic',system-ui,sans-serif;
         font-size:14px; line-height:1.7; min-height:100vh;
         display:flex; align-items:center; justify-content:center; padding:24px; }
  .box { max-width:420px; text-align:center; }
  .dot { width:34px; height:34px; margin:0 auto 18px; border-radius:50%;
         border:2px solid #21252e; border-top-color:#5b8cff; animation:spin 1s linear infinite; }
  @keyframes spin { to { transform:rotate(360deg); } }
  h1 { font-size:17px; margin-bottom:10px; letter-spacing:.3px; }
  p { color:#9aa1ad; font-size:13px; }
  .why { margin-top:16px; padding-top:16px; border-top:1px solid #21252e;
         color:#7d838f; font-size:12px; }
  .t { margin-top:14px; color:#5c626e; font-size:11.5px; }
  b { color:#c9ced8; font-weight:600; }
</style>
</head>
<body>
  <div class="box">
    <div class="dot"></div>
    <h1>잠시 준비 중입니다</h1>
    <p>서버를 새로 올리는 중입니다. 곧 다시 열립니다.</p>
    <div class="why">
      새로 켤 때 그동안의 추천 기록을 처음부터 다시 읽어 취향 모델을 복원합니다.
      기록이 쌓인 만큼 시간이 걸립니다 — 보통 <b>몇 분</b>입니다.
    </div>
    <div class="t">이 화면은 <span id="s">15</span>초 뒤 자동으로 다시 시도합니다.</div>
  </div>
<script>
  // 사용자가 새로 고치지 않아도 뜨게 한다. 15초는 헬스체크 주기(30초)의 절반이라
  // 앱이 healthy 가 된 직후에 늦지 않게 걸린다.
  var n = 15, el = document.getElementById('s');
  setInterval(function () {
    n -= 1;
    if (n <= 0) { location.reload(); return; }
    el.textContent = n;
  }, 1000);
</script>
</body>
</html>
