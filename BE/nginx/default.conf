# 맛추리 엣지(nginx). 인터넷과 맞닿는 유일한 프로세스다.
#
# 이 파일은 nginx.conf 의 **http{} 안에서** include 된다
# (nginx:alpine 의 /etc/nginx/nginx.conf → `include /etc/nginx/conf.d/*.conf;`).
# 그래서 log_format · map · limit_req_zone 같은 http 지시어를 여기 맨 위에 둘 수 있다 —
# conf.d 만 마운트하는 구조에서는 server{} 안에 둘 수 없는 것들이라 이 사실이 전제다.
# conf.d 는 디렉토리째 마운트되므로 이미지 기본 default.conf 는 사라지고 이 파일이 전부다.
# `.htpasswd` 는 `*.conf` 가 아니라서 include 되지 않는다(비밀번호 파일이지 설정이 아니다).

# 버전을 숨긴다. 에러 페이지와 Server 헤더가 "nginx/1.31.4" 를 말할 이유가 없다.
server_tokens off;

# ── 요청 id ────────────────────────────────────────────────────────────────
# 앱이 이미 붙여 보낸 추적 id 가 있으면 그것을 이어 쓰고, 없으면 nginx 가 만든다.
# 형식을 검사하는 이유: 이 값은 그대로 로그와 업스트림 헤더에 실리는 클라이언트 입력이다.
# 길이·문자를 묶어 두지 않으면 로그 한 줄이 남의 손에 넘어간다(escape=json 위의 이중 방어).
map $http_x_request_id $req_id {
    default                   $request_id;
    "~^[A-Za-z0-9._-]{8,64}$" $http_x_request_id;
}

# ── 웹소켓 업그레이드 ──────────────────────────────────────────────────────
# Grafana Live(실시간 패널)와 Explore 가 웹소켓을 쓴다. Connection 헤더에 $http_upgrade
# 를 그대로 넣으면 안 되는 이유: 평범한 요청은 그 값이 빈 문자열이라 `Connection: ` 이
# 되어 keep-alive 가 깨진다. 그래서 map 으로 `upgrade` 나 `close` 중 하나로 만든다.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
}

# ── CSP 는 HTML 응답에만 붙인다 ────────────────────────────────────────────
# JSON 응답에 CSP 를 붙여도 브라우저가 할 일이 없다. HTML 인 응답은 셋뿐이다 —
# /admin(+/admin/map) · /taste/example · /docs. $sent_http_content_type 은
# add_header 시점에 이미 정해져 있어서 이렇게 응답별로 고를 수 있다.
#
# 'unsafe-inline' 이 필요한 이유: 우리 화면 세 장은 빌드 없는 단일 HTML 이라
#   <script>·<style> 이 본문에 있고 onclick/style 속성도 쓴다(admin.html 41곳).
#   /docs 의 SwaggerUIBundle 초기화도 인라인이다. nonce 는 서버가 페이지를 렌더링해야
#   붙일 수 있는데 이 셋은 정적 파일이라 붙일 자리가 없다.
# cdn.jsdelivr.net: FastAPI 의 /docs 가 Swagger UI 5 (js·css) 를 여기서 받는다.
# fastapi.tiangolo.com: /docs 의 파비콘.
# *.kakaocdn.net · *.daumcdn.net: 카드 사진·메뉴 사진. 실제로 5개 호스트가 섞여 오고
#   (t1.daumcdn.net · t1.kakaocdn.net · img1/thumb/blog.kakaocdn.net) 데이터가 바뀌면
#   또 늘어난다. **URL 이 http:** 라서 스킴을 적지 않았다 — 스킴 없는 호스트는 http 페이지에서
#   http·https 를 모두 허용한다(나중에 TLS 를 붙이면 이 사진들은 어차피 mixed content 다).
map $sent_http_content_type $csp {
    default      "";
    "~*^text/html" "default-src 'self'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'; object-src 'none'; img-src 'self' data: blob: *.kakaocdn.net *.daumcdn.net https://fastapi.tiangolo.com; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; font-src 'self' data:; connect-src 'self'";
}

# ── 접근 로그: 한 줄 JSON ──────────────────────────────────────────────────
# `docker compose -p backmock logs nginx | jq` 로 바로 거르려고 JSON 으로 찍는다.
# escape=json 이 없으면 User-Agent 의 따옴표 하나가 그 줄을 통째로 깨뜨린다.
# request_time - upstream_response_time = 엣지에서 쓴 시간(느린 클라이언트·대기)이라
#   둘을 같이 남긴다. 앱의 JSON 로그와는 request_id 로 잇는다.
# limit_req_status/limit_conn_status: PASSED·DELAYED·REJECTED. 429 를 세기 전에
#   '누가 몇 번이나 문턱에 닿았나' 를 봐야 숫자를 조일지 풀지 정할 수 있다.
log_format json escape=json '{"ts":"$time_iso8601","request_id":"$req_id",'
    '"remote_addr":"$remote_addr","x_forwarded_for":"$http_x_forwarded_for",'
    '"method":"$request_method","uri":"$request_uri","status":$status,'
    '"bytes_sent":$bytes_sent,"request_time":$request_time,'
    '"upstream_response_time":"$upstream_response_time",'
    '"upstream_status":"$upstream_status",'
    '"user_agent":"$http_user_agent","referer":"$http_referer",'
    '"limit_req_status":"$limit_req_status","limit_conn_status":"$limit_conn_status"}';

# ── 레이트 리밋 ────────────────────────────────────────────────────────────
# 근거는 앱의 사용 모양이다. 스와이프는 카드 한 장에 요청 한 번꼴이고 사람 손으로는
# 초당 1~2건이 한계다. 10r/s 는 그 10배 여유 — 정상 사용자는 평생 안 닿는다.
# burst=30 nodelay: 화면 진입 한 번에 /filters·/users/{id}·/cards·상세·이미지 요청이
#   수십 건 몰린다. nodelay 가 없으면 이 묶음이 3초에 걸쳐 찔끔찔끔 나가 화면이 느려진다.
#   nodelay 는 '초과분을 지연시키지 말고 바로 통과시키되 토큰은 소진한다' 이므로,
#   순간 묶음은 빠르게 지나가고 계속 밀어붙이는 쪽만 429 로 끊긴다.
# 10m 존이면 IP 약 16만 개를 기억한다(키 하나에 64바이트).
limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;

# id 발급만 따로 조인다. 사람은 앱을 처음 켤 때 한 번 부르고 다시 부르지 않는다.
# 스크립트가 돌면 state/users.jsonl 이 끝없이 자라고 재시작 복원 시간이 그만큼 길어진다
# (복원은 로그를 처음부터 다시 먹인다).
#
# **rate 는 1r/s 그대로 두고 burst 만 5 → 60 으로 연다** (2026-09-22).
# 이 존의 키는 IP 다. 교육장에서 쓰면 30명이 NAT 뒤에서 한 사람으로 계산된다 —
# 2026-09-22 운영 실측: 한 IP 에서 동시 10건 중 **정확히 6건**만 통과했다(burst 5 + 토큰 1).
# 30명이면 24명이 앱 첫 화면에서 429 를 받는데, 앱은 429 를 치명적 오류로 보고 화면을
# 포기한다(FE 는 고칠 수 없다 — 팀 규정). 카드를 한 장도 못 보고 죽는다.
#
# 막을 것은 '계속 밀어붙이는 스크립트' 이지 '30명이 동시에 앱을 켜는 순간' 이 아니다 —
# 앞의 것은 rate 가 정하고 뒤의 것은 burst 가 정한다. rate 를 안 건드리므로 users.jsonl
# 무한 증식을 막는 원래 성질은 그대로 남는다. 60 은 30명 + 재시도 여유다.
limit_req_zone $binary_remote_addr zone=mint:10m rate=1r/s;

# 관측 화면(Grafana)만 쓰는 넉넉한 존. api 존(10r/s)으로는 Grafana 가 아예 안 열린다 —
# 대시보드 한 장을 그리는 데 js·css 조각과 패널별 쿼리로 50~150건이 한꺼번에 나가고,
# burst 30 에서 잘리면 화면이 반쯤 그려지다 만다. 사람 한둘이 보는 관리 화면이라
# 30r/s·burst 120 이 위험을 늘리지 않는다(이 경로는 어차피 Grafana 로그인 뒤에 있다).
limit_req_zone $binary_remote_addr zone=ui:10m rate=30r/s;

# 동시 연결. 브라우저 한 탭이 호스트당 6개를 열고 카드 사진까지 받으므로 20이면 넉넉하다.
# 목적은 속도 제한이 아니라 한 IP 가 워커 연결을 다 차지하는 것을 막는 것이다.
limit_conn_zone $binary_remote_addr zone=conn:10m;

# 기본값은 503 이다. 429 여야 클라이언트가 '내가 너무 빨랐다' 를 알고 물러설 수 있다.
limit_req_status  429;
limit_conn_status 429;

# ── 업스트림으로 넘길 헤더 ─────────────────────────────────────────────────
# http{} 에 한 번만 쓴다. location 안에서 proxy_set_header 를 **하나라도** 쓰면
# 상위 단계의 것이 전부 사라지는 것이 nginx 의 상속 규칙이라, 아래 location 들은
# 헤더를 다시 쓰지 않는다(한 곳에만 있으면 한 곳만 고치면 된다).
proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Request-ID      $req_id;

# 30s. 가장 느린 호출이 GET /cards 이고(두 정책이 성분을 다시 계산한다) 수백 ms 다.
# 이보다 오래 걸리면 앱이 이미 포기한 뒤라 연결을 붙들고 있을 이유가 없다.
proxy_read_timeout 30s;

server {
    listen 80;
    server_name api.example.com;

    # 컨테이너 로그로 내보낸다 — 파일로 쌓으면 이미지 안에서 늙어 죽고 아무도 안 본다.
    access_log /dev/stdout json;
    error_log  /dev/stderr warn;

    # 본문은 전부 작은 JSON 이다(가장 큰 것이 필터·위치 저장으로 100바이트 남짓).
    # 16k 를 넘겨 보내는 쪽은 우리 앱이 아니다.
    # **예외는 설문 사진 업로드 하나뿐**이고, 그 location 에서만 올린다(아래 참고).
    client_max_body_size  16k;
    client_body_timeout   10s;
    client_header_timeout 10s;

    limit_conn conn 20;

    # 보안 헤더는 여기 한 곳에만 둔다. add_header 도 상속 규칙이 같아서
    # location 에 하나라도 add_header 를 쓰면 이 다섯 줄이 그 location 에서 사라진다.
    # always: 401·429·502 같은 nginx 자체 응답에도 붙인다.
    add_header X-Content-Type-Options nosniff always;
    # 화면 셋(admin·map·taste/example) 다 iframe 을 안 쓴다 — SAMEORIGIN 도 필요 없다.
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    # 이 서비스가 브라우저 기능을 하나도 안 쓴다는 선언. 위치는 앱이 네이티브로 받아
    # PUT /users/{id}/location 으로 보내므로 웹 화면에는 geolocation 도 필요 없다.
    add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), microphone=(), payment=(), usb=()" always;
    # $csp 가 빈 문자열이면(=HTML 이 아니면) nginx 는 헤더를 붙이지 않는다.
    add_header Content-Security-Policy $csp always;

    # ── 관리자 ─────────────────────────────────────────────────────────────
    # 접두사 전체를 한 번에 막는다 — 화면(/admin, /admin/map)과 내부 API(/admin/api/*)가
    # 같은 문을 쓴다. 화면만 막으면 API 로 같은 것을 다 볼 수 있다:
    # /admin/api/users/{id} 는 그 사람의 이력·가중치·다음에 받을 카드까지 준다.
    # 비밀번호 파일은 conf.d 안에 있다(마운트되는 유일한 디렉토리라 파일을 더 붙일 곳이 없다).
    # git 에는 안 올라간다 — .gitignore/.dockerignore 참고. 평문은 EC2 의
    # ~/matchuri-secrets/admin-basic-auth.txt 에만 있다.
    location /admin {
        auth_basic           "matchuri admin";
        auth_basic_user_file /etc/nginx/conf.d/.htpasswd;

        limit_req zone=api burst=30 nodelay;
        proxy_intercept_errors on;      # 준비 전 503 → 점검 화면 (아래 error_page 주석)
        proxy_pass http://app:8000;
    }

    # ── id 발급 ────────────────────────────────────────────────────────────
    # `= /users` 는 정확히 이 경로만 잡는다. /users/{id}/... 는 아래 location / 로 간다.
    # 두 존을 겹쳐 건다: 좁은 쪽(mint)이 발급 자체를, 넓은 쪽(api)이 그 IP 의 총량을 본다.
    location = /users {
        # 두 존이 겹쳐 걸리면 **좁은 쪽이 이긴다**. api 를 30 에 두면 mint 60 이 무의미해지므로
        # 이 두 location 에서만 같이 60 으로 맞춘다(다른 location 의 api burst 는 안 건드린다).
        limit_req zone=mint burst=60 nodelay;
        limit_req zone=api  burst=60 nodelay;
        proxy_pass http://app:8000;
    }
    location = /user {
        # 두 존이 겹쳐 걸리면 **좁은 쪽이 이긴다**. api 를 30 에 두면 mint 60 이 무의미해지므로
        # 이 두 location 에서만 같이 60 으로 맞춘다(다른 location 의 api burst 는 안 건드린다).
        limit_req zone=mint burst=60 nodelay;
        limit_req zone=api  burst=60 nodelay;
        proxy_pass http://app:8000;
    }

    # 미리 수집한 가게·메뉴·리뷰 사진. API 호출 제한과 별개로 정적 JPEG를 전달한다.
    # 파일은 같은 URL에서 덮어쓰지 않는다. 404에는 immutable 캐시를 붙이지 않는다.
    location /media/catalog/ {
        alias /var/www/media/catalog/;
        autoindex off;
        types { }
        default_type image/jpeg;
        add_header X-Content-Type-Options nosniff always;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # ── 설문 사진 ─────────────────────────────────────────────────────────
    # 앱이 쓴 파일을 nginx 가 직접 내보낸다(compose 가 media 볼륨을 읽기 전용으로 붙인다).
    # 앱을 거치면 파이썬이 바이트를 퍼 나르고 캐시도 못 한다.
    #
    # 파일 이름이 uuid 라 **내용이 바뀌는 일이 없다** — 같은 주소면 영원히 같은 사진이다.
    # 그래서 캐시를 길게 준다. 지우면 404 이고, 그건 캐시가 만료되기 전에도 맞는 답이다.
    location /media/ {
        alias /var/www/media/;
        # 디렉토리 목록을 주지 않는다. 기본값이 off 지만 명시한다 — 켜지면 남의 사진
        # id 가 통째로 나열된다(uuid 로 이름을 지은 이유가 무의미해진다).
        autoindex off;
        # 이 아래에는 우리가 구운 JPEG 만 있다. 그래도 형식을 고정한다 — 볼륨에 다른
        # 것이 섞여도 브라우저가 실행 가능한 형식으로 해석하지 않게 한다.
        types { }
        default_type image/jpeg;
        add_header X-Content-Type-Options nosniff always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
        limit_req zone=api burst=60 nodelay;
    }

    # 사진 **업로드**. 전역 16k 를 여기서만 올린다. 앱의 상한(10MB)보다 한 칸 크게 둔다 —
    # multipart 경계와 헤더가 본문에 더해지므로 딱 맞추면 10MB 사진이 413 으로 막힌다.
    # 그러면 '왜 거절됐나' 를 앱이 설명할 수 없다(nginx 의 413 에는 우리 메시지가 없다).
    location ~ ^/users?/[^/]+/surveys/[0-9]+/photos$ {
        client_max_body_size 11m;
        # 사진은 10MB 를 올릴 수 있으니 본문 타임아웃도 늘린다. 10s 로는 느린 회선에서
        # 끊긴다.
        client_body_timeout 60s;
        limit_req zone=api burst=10 nodelay;
        proxy_pass http://app:8000;
    }

    # ── 앱이 없을 때 보여 줄 화면 ──────────────────────────────────────────
    #
    # **왜 필요한가.** 앱을 새로 켜면 4~5분간 8000 포트가 아예 안 열린다 — 복원이
    # `main.py` 의 import 시점에 있어서(유사도 행렬 + 선호 기록 재생) uvicorn 이 그
    # 뒤에야 바인딩한다. 그 동안 여기로 오는 모든 요청이 nginx 기본 502 페이지를 받았다.
    # 2026-09-17 에 실제로 그 상태를 5분쯤 보였다.
    #
    # `depends_on: service_healthy` 는 이 경우를 못 막는다. 그건 `compose up` 으로
    # nginx 까지 같이 뜰 때 순서를 잡아 주는 것이고, nginx 가 이미 떠 있는데 앱만
    # 재시작하면 기다려 줄 방법이 없다.
    #
    # **상태를 503 으로 바꿔서 준다.** 502(업스트림에 못 닿음)는 클라이언트가 할 수
    # 있는 것이 없다는 뜻이고, 503 은 '지금은 안 되지만 다시 오라' 는 뜻이다.
    # `Retry-After` 를 붙여 그 '다시' 를 명시한다. 앱이 준비 전 요청을 스스로 503 으로
    # 돌려주게 됐고(`app/boot.py`, 2026-09-18) **같은 화면이 그대로 재사용된다** —
    # `location /`·`/admin` 의 `proxy_intercept_errors on` 이 그 503 을 여기로 보낸다.
    # `=503` 은 원래 상태(502·504)를 503 으로 **바꿔서** 준다. 502 는 "업스트림에 못
    # 닿았다" 라 클라이언트가 할 것이 없다는 뜻이고, 503 은 "지금은 안 되지만 다시
    # 오라" 다. 그래서 `Retry-After` 도 같이 붙인다.
    error_page 502 503 504 =503 /maintenance.html;

    # `internal` — 이 경로는 error_page 로만 들어올 수 있다. 밖에서 직접 부르면 404 다
    # (점검 화면이 상시 URL 로 남으면 그것부터 크롤링에 잡힌다).
    # `./nginx` 가 컨테이너의 `/etc/nginx/conf.d` 로 마운트된다(docker-compose.yml).
    # nginx 는 `conf.d` 에서 `*.conf` 만 include 하므로 .html 이 섞여도 무해하다.
    location = /maintenance.html {
        internal;
        root /etc/nginx/conf.d;
        access_log off;

        # 아래 네 줄이 **위쪽 보안 헤더 다섯 줄을 이 응답에서 지운다**(add_header 상속
        # 규칙 — 파일 위쪽 주석 참고). 점검 화면에 필요한 것만 다시 붙인다.
        add_header Retry-After 15 always;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
    }

    # ── 운영 탐침 둘은 가로채지 않는다 ───────────────────────────────────
    # 앱이 복원 중일 때 `/readyz` 는 **503 을 JSON 으로** 준다 — 진행률(선호 n/N건)이
    # 들어 있다. 아래 `location /` 은 앱의 503 을 점검 화면으로 바꾸므로
    # (`proxy_intercept_errors`), 이 둘만 따로 두어 JSON 이 그대로 나가게 한다.
    # Jenkins 배포 검사와 감시가 이걸 폴링한다. `/healthz` 는 복원 중에도 200 이다.
    location = /readyz {
        limit_req zone=api burst=30 nodelay;
        proxy_pass http://app:8000;
    }
    location = /healthz {
        limit_req zone=api burst=30 nodelay;
        proxy_pass http://app:8000;
    }

    # ── 그 밖의 전부(앱) ───────────────────────────────────────────────────
    # /cards · /preferences · /filters · /taste/* 와 공개로 두는 것들:
    # /docs · /openapi.json — 프론트가 타입을 여기서 생성하므로 열려 있어야 한다.
    # /metrics 는 더 이상 공개가 아니다(바로 아래 `= /metrics` 참고).
    #
    # `proxy_intercept_errors on` — 앱이 준비 전 요청에 스스로 503 을 주게 됐다
    # (`app/boot.py`, 2026-09-18). 이 지시어가 없으면 그 503 JSON 이 그대로 나가고,
    # 있으면 위 `error_page 502 503 504` 가 받아 **같은 점검 화면**으로 바꿔 준다 —
    # 포트가 안 열려 502 였던 예전과 사용자가 보는 것이 똑같다. 앱의 다른 5xx 는
    # 이 목록에 없으므로 그대로 나간다(500 은 request_id 를 담은 JSON 이어야 한다).
    # 취향 화면의 세션별 조회만 순간 허용치를 크게 둔다. **임시방편이다.**
    #
    # 앱은 "내 취향" 한 장을 그리려고 그 사람의 **세션 수만큼** 이 주소를 연달아 부른다
    # (FE/app/lib/services/taste_api.dart: _fetchTasteAcrossSessions). 앱을 켤 때마다 세션이
    # 하나씩 늘어서(bootstrap_gate.dart) 어떤 사용자는 이미 92개다. 빠른 망에서는 초당 40건까지
    # 나가 burst 30 을 넘기고, 앱은 429 를 치명적 오류로 보고 화면을 포기한다(2026-09-20 21:38,
    # 23:57 실제로 그랬다). 사람 단위 취향 주소가 생기면(요청 1건) 이 블록은 지운다.
    #
    # rate 는 그대로 10r/s 다 — 계속 밀어붙이는 쪽은 여전히 끊긴다. 읽기 전용 조회라
    # 순간 묶음을 크게 받아 줘도 쓰기·발급 경로의 보호에는 영향이 없다.
    location ~ ^/user/[^/]+/session/[^/]+/taste$ {
        limit_req zone=api burst=200 nodelay;
        proxy_intercept_errors on;
        proxy_pass http://app:8000;
    }

    location / {
        limit_req zone=api burst=30 nodelay;
        proxy_intercept_errors on;
        proxy_pass http://app:8000;
    }

    # ── 공개 /metrics 는 닫는다 ────────────────────────────────────────────
    # 예전에는 열어 두었다(집계 수치뿐이라 개인 정보가 없다). 지금은 Prometheus 가
    # 같은 도커 네트워크에서 app:8000 을 직접 긁으므로 밖에 열어 둘 이유가 사라졌다.
    # 열어 두면 사용자 수·스와이프 수·정책별 성적이 인터넷에 그대로 나가고, 무엇보다
    # 라우트 목록이 통째로 노출된다. 403 이 아니라 404 인 이유는 '있지만 막혔다' 를
    # 알려 줄 필요가 없어서다. `= ` 는 정확히 이 경로만 잡는다.
    location = /metrics {
        access_log off;
        return 404;
    }

    # ── nginx 자체 상태(내부 전용) ─────────────────────────────────────────
    # nginx-exporter 가 15초에 한 번 부르고, 그 결과가 Grafana 의 'nginx 연결' 패널이 된다.
    # 대역: backmock_default 는 지금 172.19.0.0/16 이지만(docker network inspect
    # backmock_default) 도커가 네트워크를 다시 만들면 172.x 안에서 번호가 바뀐다.
    # 그래서 한 대역이 아니라 도커 기본 풀 전체(172.16.0.0/12)를 연다 —
    # 이 대역은 호스트 밖에서 라우팅되지 않으므로 인터넷에서는 닿을 수 없다.
    location = /nginx_status {
        stub_status;
        allow 127.0.0.1;
        allow 172.16.0.0/12;
        deny  all;
        # 15초마다 한 줄씩 쌓이면 진짜 사고 로그가 그 안에 묻힌다.
        access_log off;
    }

    # ── 관측 대시보드(Grafana) ─────────────────────────────────────────────
    # 슬래시 없는 /grafana 로 들어오면 위 location 이 안 잡는다(그러면 location / 로
    # 새어 앱이 404 를 준다). 한 번 돌려세운다.
    location = /grafana {
        return 301 /grafana/;
    }

    location /grafana/ {
        # **끝에 `/` 를 붙이지 않는다.** 붙이면 nginx 가 /grafana/ 접두사를 잘라서
        # 업스트림에 `/` 를 넘기는데, Grafana 는 GF_SERVER_SERVE_FROM_SUB_PATH=true 라
        # 접두사가 붙은 경로를 기대한다 — 잘린 `/` 를 받으면 root_url(/grafana/)로
        # 301 을 돌려주고, 그 요청이 다시 여기로 와서 **무한 리다이렉트**가 된다
        # (실제로 겪었다: /grafana/ → 301 → /grafana/ → …). 접두사를 그대로 넘기고
        # 잘라 내는 일은 Grafana 에게 맡긴다.
        proxy_pass http://grafana:3000;

        limit_req zone=ui burst=120 nodelay;

        # 웹소켓(Grafana Live). 이게 없으면 화면은 뜨지만 브라우저 콘솔에 재연결
        # 오류가 끝없이 쌓인다.
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        # ↑ location 안에서 proxy_set_header 를 **하나라도** 쓰면 http{} 의 다섯 줄이
        # 통째로 사라진다(이 파일 위쪽에 적어 둔 nginx 상속 규칙). 그래서 그대로 옮겨 적는다.
        # 특히 Host 가 빠지면 Grafana 가 만드는 리디렉션 주소가 "grafana:3000" 이 된다.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID      $req_id;

        # server{} 의 16k 로는 대시보드 JSON 을 올리거나 스냅샷을 만들 때 413 이 난다.
        client_max_body_size 2m;
        # Live 스트림은 아무 일 없이 오래 열려 있다(기본 30s 로는 계속 끊긴다).
        proxy_read_timeout 300s;
        proxy_buffering    off;

        # add_header 도 상속 규칙이 같다 — 여기 한 줄이라도 쓰면 server{} 의 다섯 줄이
        # 이 location 에서 사라진다. 그래서 보안 헤더 넷을 다시 적는다.
        # **CSP 만 일부러 뺀다.** 우리 CSP 는 화면 셋(admin·map·taste)에 맞춘 것이라
        # Grafana 가 쓰는 blob: 워커와 data: 폰트를 막아 패널이 빈 채로 뜬다.
        # Grafana 는 자기 CSP 설정을 따로 갖고 있다(지금은 끔).
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), microphone=(), payment=(), usb=()" always;
    }

    # Jenkins (--prefix=/jenkins 로 띄웠으므로 경로를 자르지 않는다)
    # 예전과 똑같이 둔다. 헤더는 위 http{} 에서 상속받으므로 여기서 다시 쓰지 않는다
    # (X-Request-ID 가 하나 늘 뿐 Jenkins 는 모르는 헤더를 무시한다).
    # 레이트 리밋도 걸지 않는다 — 빌드 로그 스트리밍이 초당 수십 건씩 오간다.
    location /jenkins {
        proxy_pass http://jenkins:8080;

        proxy_read_timeout 300s;
        proxy_buffering    off;
    }
}
