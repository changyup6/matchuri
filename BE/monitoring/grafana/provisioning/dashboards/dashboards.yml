# 대시보드도 파일이 원본이다. 화면에서 고친 것은 저장되지 않는다(allowUiUpdates: false) —
# 일부러 그렇게 둔다. 패널을 바꾸려면 monitoring/grafana/dashboards/*.json 을 고치고
# 커밋해야 하므로, '누가 언제 왜 이 패널을 이렇게 바꿨나' 가 git 에 남는다.
# (탐색은 자유롭게 해도 된다 — Explore 와 패널 편집기는 열리고, 저장만 막힌다.)
apiVersion: 1

providers:
  - name: matchuri
    orgId: 1
    type: file
    disableDeletion: false
    allowUiUpdates: false
    # 10s 마다 파일을 다시 읽는다. 파일을 고치고 저장하면 새로고침만으로 반영된다.
    updateIntervalSeconds: 10
    options:
      path: /var/lib/grafana/dashboards
      # 디렉토리 구조를 폴더로 쓴다 — 지금은 한 층이라 폴더가 안 생기지만,
      # 나중에 dashboards/추천/ 처럼 나누면 그대로 폴더가 된다.
      foldersFromFilesStructure: true
